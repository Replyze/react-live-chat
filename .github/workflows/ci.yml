name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: React ${{ matrix.react }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ['18', '19']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: matrix.react == '18'
        run: npm install --no-save --ignore-scripts react@18.3.1 react-dom@18.3.1 @types/react@18.3.31 @types/react-dom@18.3.7
      - run: npm run typecheck
      - run: npm test
      # The package against the real widget.js from cdn.replyze.chat (only the Replyze API is faked).
      - run: npm run test:widget
      - run: npm run build
